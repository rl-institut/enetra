{% comment %}
Helper for consistent styling of modals
{% endcomment %}
<c-vars closedby="any" ></c-vars>

<dialog id="{{id}}"
        closedby="{{closedby}}"
        class="{{class}} fixed inset-0 bg-transparent p-0 m-auto overflow-visible backdrop:bg-black/80 min-w-[400px] max-w-[80%]"
        {{attrs}}
>
  <div class="bg-white flex flex-col gap-5 p-6 rounded-2xl shadow-[0px_8px_32px_rgba(0,0,0,0.18)] ">
{{slot}}
</div>
</dialog>
