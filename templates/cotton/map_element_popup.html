<div style="display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px">
  {{ icon }}
  <div>
    <div style="font-family: 'Inter', sans-serif;
                font-weight: 600;
                font-size: 14px;
                color: #1e293b">{{ title }}</div>
    <div style="font-family: 'Inter', sans-serif;
                font-size: 12px;
                color: #64748b">{{ name|default:"Kein Name" }}</div>
  </div>
  <div style="margin-left: auto;
              font-family: 'Inter', sans-serif;
              font-weight: 600;
              font-size: 12px;
              color: #0891b2">Öffnen</div>
</div>
<div style="height: 1px; background: #e2e8f0; margin: 12px 0;"></div>
<div style="font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #64748b;
            line-height: 1.6">
  <div style="display: flex;
              justify-content: space-between;
              margin-bottom: 4px">
    <span>Vorlage:</span>
    <span style="color: #1e293b; font-weight: 500;">Dieselgenerator</span>
  </div>
  <div style="display: flex;
              justify-content: space-between;
              margin-bottom: 4px">
    <span>Typ:</span>
    <span style="color: #1e293b; font-weight: 500;">Heizkessel</span>
  </div>
  <div style="display: flex;
              justify-content: space-between;
              margin-bottom: 4px">
    <span>Energieträger:</span>
    <span style="color: #1e293b; font-weight: 500;">Gas</span>
  </div>
  <div style="display: flex;
              justify-content: space-between;
              margin-bottom: 4px">
    <span>Kapazität:</span>
    <span style="color: #1e293b; font-weight: 500;">3.000 kW</span>
  </div>
  <div style="display: flex; justify-content: space-between;">
    <span>Effizienz:</span>
    <span style="color: #1e293b; font-weight: 500;">50 %</span>
  </div>
</div>
