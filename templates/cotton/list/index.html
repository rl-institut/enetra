<c-vars :customTitle=False :border=True :bulkMode=False count title description></c-vars>
<div class="cotton-list bg-white content-stretch flex flex-col gap-[12px] items-start relative size-full"
  x-data='{isBulkMode: {{bulkMode|lower}} }'>
  <div class="content-stretch flex items-center justify-between relative shrink-0 w-full">
    {% if customTitle %}
      {{ title }}
    {% else %}
      <p class="font-['Inter:Semi_Bold',sans-serif] font-semibold leading-[0] not-italic relative shrink-0 text-[#1e293b] text-[0px]">
        <span class="leading-[normal] text-[14px]">{{ title }}</span>
        {% if count %}
          <span class="leading-[normal] text-[13px]">&nbsp</span>
          <span class="font-['Inter:Regular',sans-serif] font-normal leading-[normal] text-[13px]">({{ count }})</span>
        {% endif %}
      </p>
    <c-list.button></c-list.button>
    {% endif %}
  </div>
  <div class=" {% if border %}border-[#cbd5e1] border-b border-solid{% endif %}  content-stretch flex flex-col items-start pb-px relative rounded-[8px] shrink-0 w-full">
    {{ slot }}
  </div>
</div>
