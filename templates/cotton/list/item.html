<c-vars value bulkModeIcon="" singleModeIcon=""  selected=None active  class :border=True title :defaultHxDetails=False item get_url="" ></c-vars>
<label class="cotton-list-item group/listitem {% if border %}border border-[#cbd5e1] border-solid{% endif %}
  {% if active %}
  bg-white hover:bg-[#f8fafc] cursor-pointer
  {% else %}
  bg-gray-200  cursor-not-allowed
  {% endif %}
  {{ class }} "
       {{attrs}}
        {% if get_url %}
          hx-trigger='getdetails'
          hx-get="{{ get_url }}"
      {% endif %}
>
  <div class="relative shrink-0 size-4 flex items-center justify-center">
    <input :type="isBulkMode ? 'checkbox' : 'radio'"
           id="input_{{ value }}_{{ radioName }}"
          {% if selected is None %}
            preserve-val
          {% endif %}
          {% if selected %}
            checked
          {% endif %}
          {% if not active %}
          disabled
          {% endif %}

           :name="isBulkMode ?'{{value }}' : '{{ radioName }}'"
           value="{{ value }}"
           class="cotton-list-item-input size-3.5  accent-[#0E7490]" />
  </div>
  <div class="relative shrink-0 size-4 ">
   <div class="group-has-[input:checked]/listitem:hidden">
            <svg class="text-[#0E7490] w-4 h-4" viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><use href="{{ sprite_url }}#{{ item.icon_unselected }}"></use></svg>
    </div>
     <div class="hidden group-has-[input:checked]/listitem:block">
            <svg class="text-[#0E7490] w-4 h-4" viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><use href="{{ sprite_url }}#{{ item.icon_selected }}"></use></svg>
    </div>
  </div>
  <div class="content-stretch flex flex-[1_0_0] items-center gap-1 min-h-px min-w-px relative">
    <p class="cotton-list-item-title">{{ title }}</p>
  </div>
  <div class="relative shrink-0 size-3">
    <div class="absolute inset-[0.37%_0.1%_-0.27%_0.28%]">
      <div x-show="isBulkMode" x-cloak>
        {{bulkModeIcon}}
      </div>
      <div x-show="!isBulkMode" x-cloak>
        {{singleModeIcon}}
      </div>
    </div>
  </div>
</label>
