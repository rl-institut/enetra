<c-vars bulkModeIcon="" singleModeIcon=""  selected=None active  class :border=True title :defaultHxDetails=False item ></c-vars>
{% comment %}
  Should the selection stay when BulkSelect is deactived
{% endcomment %}
{% comment %}
  selected is populated by the input
wrap everyting in a label so everything toggles the radio/checkbox
{% endcomment %}
<label class="cotton-list-item group/listitem {% if border %}border border-[#cbd5e1] border-solid{% endif %}
  {% if active %}
  bg-white hover:bg-[#f8fafc] cursor-pointer
  {% else %}
  bg-gray-200  cursor-not-allowed
  {% endif %}
  {{ class }} "

       {{ attrs }}

       {% if defaultHxDetails %}
        x-data
        @click="if (event.target instanceof HTMLInputElement) $nextTick(()=>$dispatch('getdetails'))"
        @select-instance-{{item.internal_id}}.window="$el.click()"
        hx-include="closest form"
        {% if scenario %}
          hx-get="{% url item.rud_url scenario_internal_id=scenario.internal_id model=item.model_name %}"
        {% else %}
          hx-get="{% url item.rud_url  model=item.model_name %}"
        {% endif %}
        hx-trigger='getdetails'
        hx-on::trigger="dispatchEvent(new CustomEvent('show-detail-sidebar'));"
      {% endif %}

>
  <div class="relative shrink-0 size-[16px] flex items-center justify-center">
    <input :type="isBulkMode ? 'checkbox' : 'radio'"
            {% comment %}
             With preserve-val we keep this input's checked/value state across an oob swap (the
             server can't know client-side selection state). Selection visuals read this input's
             :checked directly via CSS, so nothing needs to resync after the swap.
            {% endcomment %}
           id="input_{{ value }}_{{ radioName }}"
          {% if selected is None %}
            preserve-val
          {% endif %}
          {% if selected %}
            checked
          {% endif %}
          {% if not active %}
          disabled
          {% endif %}

           :name="isBulkMode ?'{{value }}' : '{{ radioName }}'"
           value="{{ value }}"
           class="cotton-list-item-input size-[14px]  accent-[#0E7490]" />
  </div>
  {% comment %}
    Should the image be shown even without bulkselection?
  {% endcomment %}
  <div class="relative shrink-0 size-[12px]">
   <div class="group-has-[input:checked]/listitem:hidden">
            <svg class="text-[#0E7490] w-4 h-4" viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><use href="{{ sprite_url }}#{{ item.icon_unselected }}"></use></svg>
    </div>
     <div class="hidden group-has-[input:checked]/listitem:block">
            <svg class="text-[#0E7490] w-4 h-4 viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><use href="{{ sprite_url }}#{{ item.icon_selected }}"></use></svg>
    </div>
  </div>
  <div class="content-stretch flex flex-[1_0_0] items-center gap-[4px] min-h-px min-w-px relative">
    {% comment %}
     shrink-0 stops the element from wrapping? This is bad behaviour if we allow long names.
    {% endcomment %}
    <p class="cotton-list-item-title">{{ title }}</p>
  </div>
  <div class="relative shrink-0 size-[12px]">
    <div class="absolute inset-[0.37%_0.1%_-0.27%_0.28%]">
      <div x-show="isBulkMode" x-cloak>
        {{bulkModeIcon}}
      </div>
      <div x-show="!isBulkMode" x-cloak>
        {{singleModeIcon}}
      </div>
    </div>
  </div>
</label>
