{% if not user.is_authenticated %}
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Einloggen</button>
  </form>
{% else %}
  {% if next %}
    <p>Sie haben keinen Zugang zu dieser Seite.</p>
  {% else %}
    <p>Sie sind bereits angemeldet.</p>
  {% endif %}
  <p>Eine Weiterleitung erfolgt in 3 Sekunden.</p>
  <p><a class="btn btn--cta btn--medium" href="/">Startseite</a></p>
  <meta http-equiv="refresh" content="3;url=/" />
{% endif %}
