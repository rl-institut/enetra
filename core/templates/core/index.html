{% extends "core/base.html" %}

{% block content %}
  <header>
    Hello World!
  </header>
  {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="post">
      {% csrf_token %}
      <c-button variant="default" type="submit">Logout</c-button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Login</a>
  {% endif %}
{% endblock content %}
