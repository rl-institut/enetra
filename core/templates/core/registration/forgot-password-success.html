{% load static %}
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort vergessen – Enetra</title>
    {% include "core/imports.html" %}
  </head>
  <body class="bg-slate-50 font-[Inter,sans-serif] text-slate-800 min-h-screen flex flex-col items-center justify-center px-4 py-12">

    <div class="w-full max-w-sm flex flex-col items-center gap-8">

      <!-- Logo -->
    <img src='{% static "img/enetra-logo.svg" %}' alt="Enetra" class="h-6 object-contain" />

      <!-- Card -->
      <div class="w-full p-8 bg-white rounded-lg shadow-[0px_1px_4px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-slate-200 flex flex-col gap-6" x-data="{ sent: false }">
        <!-- Sent state -->
          <div class="flex flex-col items-center gap-6 py-2">
            <div class="w-12 h-12 bg-cyan-50 rounded-full flex items-center justify-center outline outline-1 outline-offset-[-1px] outline-cyan-200">
              <i data-lucide="mail" class="w-5 h-5 text-cyan-700"></i>
            </div>
            <div class="flex flex-col gap-1 text-center">
              <h2 class="text-lg font-bold text-slate-800">E-Mail gesendet</h2>
              <p class="text-sm text-slate-500">Falls ein Konto mit deiner Adresse existiert, erhälst du in Kürze einen Reset-Link.</p>
            </div>
            <a href='{% url "core:login" %}' class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              Zurück zur Anmeldung
            </a>
          </div>
      </div>
    </div>

    <script>lucide.createIcons();</script>
  </body>
</html>
/div>
