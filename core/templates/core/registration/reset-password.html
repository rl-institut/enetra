{% load static %}
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neues Passwort – Enetra</title>

    {% include "core/imports.html" %}

  </head>
  <body class="bg-slate-50 font-[Inter,sans-serif] text-slate-800 min-h-screen flex flex-col items-center justify-center px-4 py-12">

    <div class="w-full max-w-sm flex flex-col items-center gap-8">

      <!-- Logo -->
      <img src='{% static "images/enetra-logo.png" %}' alt="Enetra" class="h-6 object-contain" />

      <!-- Card -->
      <div class="w-full p-8 bg-white rounded-lg shadow-[0px_1px_4px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-slate-200 flex flex-col gap-6" x-data="{ saved: false }">

        <!-- Default state -->
        <template x-if="!saved">
          <div class="flex flex-col gap-6">

            <!-- Heading -->
            <div class="flex flex-col gap-1">
              <h1 class="text-2xl font-bold text-slate-800">Neues Passwort</h1>
              <p class="text-sm text-slate-500">Wählen Sie ein neues Passwort für Ihr Konto</p>
            </div>

            <!-- Form -->
            <form class="flex flex-col gap-4" @submit.prevent="saved = true">

              <!-- New password -->
              <div class="flex flex-col gap-1.5" x-data="{ show: false }">
                <label class="text-sm font-semibold text-slate-800">Neues Passwort</label>
                <div class="h-10 bg-white px-4 rounded-[3px] outline outline-1 outline-offset-[-1px] outline-slate-400 flex items-center gap-2">
                  <input :type="show ? 'text' : 'password'" placeholder="••••••••" class="text-sm text-slate-800 placeholder:text-slate-400 bg-transparent outline-none w-full" />
                  <button type="button" @click="show = !show" class="text-slate-400 hover:text-slate-600 transition-colors duration-150 cursor-pointer shrink-0">
                    <i data-lucide="eye" class="w-4 h-4" x-show="!show"></i>
                    <i data-lucide="eye-off" class="w-4 h-4" x-show="show"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm password -->
              <div class="flex flex-col gap-1.5" x-data="{ show: false }">
                <label class="text-sm font-semibold text-slate-800">Passwort bestätigen</label>
                <div class="h-10 bg-white px-4 rounded-[3px] outline outline-1 outline-offset-[-1px] outline-slate-400 flex items-center gap-2">
                  <input :type="show ? 'text' : 'password'" placeholder="••••••••" class="text-sm text-slate-800 placeholder:text-slate-400 bg-transparent outline-none w-full" />
                  <button type="button" @click="show = !show" class="text-slate-400 hover:text-slate-600 transition-colors duration-150 cursor-pointer shrink-0">
                    <i data-lucide="eye" class="w-4 h-4" x-show="!show"></i>
                    <i data-lucide="eye-off" class="w-4 h-4" x-show="show"></i>
                  </button>
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="select-none w-full px-6 py-2.5 bg-cyan-700 hover:bg-cyan-800 transition-colors duration-150 rounded-full flex justify-center items-center cursor-pointer">
                <span class="text-sm font-semibold text-white">Passwort speichern</span>
              </button>

            </form>

          </div>
        </template>

        <!-- Success state -->
        <template x-if="saved">
          <div class="flex flex-col items-center gap-6 py-2">
            <div class="w-12 h-12 bg-cyan-50 rounded-full flex items-center justify-center outline outline-1 outline-offset-[-1px] outline-cyan-200">
              <i data-lucide="check" class="w-5 h-5 text-cyan-700"></i>
            </div>
            <div class="flex flex-col gap-1 text-center">
              <h2 class="text-lg font-bold text-slate-800">Passwort gespeichert</h2>
              <p class="text-sm text-slate-500">Ihr Passwort wurde erfolgreich geändert. Sie können sich jetzt anmelden.</p>
            </div>
          <a href='{% url "core:login" %}' class="select-none w-full px-6 py-2.5 bg-cyan-700 hover:bg-cyan-800 transition-colors duration-150 rounded-full flex justify-center items-center cursor-pointer">
              <span class="text-sm font-semibold text-white">Zur Anmeldung</span>
            </a>
          </div>
        </template>

      </div>
    </div>

    <script>lucide.createIcons();</script>
  </body>
</html>
