{% load static %}
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort vergessen – Enetra</title>
    {% include "core/imports.html" %}
  </head>
  <body class="bg-slate-50 font-[Inter,sans-serif] text-slate-800 min-h-screen flex flex-col items-center justify-center px-4 py-12">

    <div class="w-full max-w-sm flex flex-col items-center gap-8">

      <!-- Logo -->
    <img src='{% static "img/enetra-logo.svg" %}' alt="Enetra" class="h-6 object-contain" />

      <!-- Card -->
      <div class="w-full p-8 bg-white rounded-lg shadow-[0px_1px_4px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-slate-200 flex flex-col gap-6" >

        <!-- Default state -->
          <div class="flex flex-col gap-6">

            <!-- Heading -->
            <div class="flex flex-col gap-1">
              <h1 class="text-2xl font-bold text-slate-800">Passwort zurücksetzen</h1>
              <p class="text-sm text-slate-500">Gebe deine E-Mail-Adresse ein. Wir senden dir einen Link zum Zurücksetzen.</p>
            </div>

            <!-- Form -->
            <form
            action="."
            method="POST"
            class="flex flex-col gap-4" >
            {% csrf_token %}

              <!-- Email -->
              <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-slate-800">E-Mail</label>
                <div class="h-10 bg-white px-4 rounded-[3px] outline outline-1 outline-offset-[-1px] outline-slate-400 flex items-center">
                  <input type="email" name="email" placeholder="name@beispiel.de" class="text-sm text-slate-800 placeholder:text-slate-400 bg-transparent outline-none w-full" />
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="select-none w-full px-6 py-2.5 bg-cyan-700 hover:bg-cyan-800 transition-colors duration-150 rounded-full flex justify-center items-center cursor-pointer">
                <span class="text-sm font-semibold text-white">Link senden</span>
              </button>

            </form>

            <!-- Back to login -->
            <a href="{% url 'core:login' %}" class="flex items-center justify-center gap-2 text-sm text-slate-500 hover:text-slate-800 transition-colors duration-150">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              Zurück zur Anmeldung
            </a>

          </div>

      </div>
    </div>

    <script>lucide.createIcons();</script>
  </body>
</html>
