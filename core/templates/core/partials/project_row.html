
<tr
  data-name="{{title}}"
  data-last_update="{% firstof last_update_sortable last_update %}"
  class="hover:bg-slate-50 transition-colors duration-100">
  <td class="px-6 py-4">
    <a href={% url 'core:project_overview' project.internal_id %} class="select-none font-semibold text-cyan-700 hover:underline">{{project.name}}</a>
  </td>
  <td class="px-6 py-4">
    <div class="select-none flex items-center gap-2 text-slate-500">
      <i data-lucide="map-pin" class="w-4 h-4 shrink-0"></i>
      <span>Berlin</span>
    </div>
  </td>
  <td class="px-6 py-4 text-slate-800 select-none">3</td>
  <td class="px-6 py-4">
    <div class="select-none flex items-center gap-2 text-slate-800">
      <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
      <span>5</span>
    </div>
  </td>
  <td class="px-6 py-4">
    <div class="select-none flex items-center gap-2 text-slate-500">
      <i data-lucide="calendar" class="w-4 h-4 shrink-0"></i>
      <span>{{project.created_at|date:"j.n.Y "}}</span>
    </div>
  </td>
  <td class="px-6 py-4">
    <div class="flex items-center justify-end gap-3">
      <a href={% url 'core:project_overview' project.internal_id %} class="select-none flex items-center gap-2 px-4 py-1.5 text-cyan-700 rounded-full outline outline-1 outline-offset-[-1px] outline-cyan-700 hover:bg-cyan-700 hover:text-white transition-colors duration-150 cursor-pointer whitespace-nowrap">
        <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
        <span class="text-xs font-semibold">Szenarienvergleich</span>
      </a>
      <div class="relative" x-data="{ open: false }">
        <button @click="open = !open" class="select-none cursor-pointer text-slate-800 hover:text-slate-500 transition-colors duration-150">
          <i data-lucide="ellipsis" class="w-4 h-4"></i>
        </button>
        <div x-show="open" @click.outside="open = false" class="absolute right-0 top-6 mt-1 bg-white rounded-[4px] shadow-[0px_4px_6px_rgba(0,0,0,0.15)] z-10 flex flex-col w-48">
          <button
            hx-post="{% url 'ports:duplicate_project' project.internal_id %}"
            hx-swap="innerHTML"
            hx-on::after-request="window.location.reload()"
            class="select-none flex items-center p-3 gap-3 text-sm text-slate-800 hover:bg-slate-50 transition-colors duration-150 w-full text-left rounded">
            <i data-lucide="copy" class="w-4 h-4 shrink-0"></i> Projekt duplizieren
          </button>
          <a href='{% url "core:user_rechte" %}' class="select-none flex items-center p-3 gap-3 text-sm text-slate-800 hover:bg-slate-50 transition-colors duration-150 w-full text-left rounded">
            <i data-lucide="users" class="w-4 h-4 shrink-0"></i> Nutzer verwalten
          </a>
          <hr class="border-slate-200" />
          <button class="select-none flex items-center p-3 gap-3 text-sm text-red-500 hover:bg-red-50 transition-colors duration-150 w-full text-left rounded">
            <i data-lucide="trash-2" class="w-4 h-4 shrink-0"></i> Projekt löschen
          </button>
        </div>
      </div>
    </div>
  </td>
</tr>
