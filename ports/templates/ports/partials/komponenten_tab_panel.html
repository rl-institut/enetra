<div class="bg-white content-stretch flex flex-col gap-[24px] items-start relative size-full">
  <!-- {/* Flächenbezogene Komponenten Section */} -->
  <c-expand.index expanded>
  <c-slot name="title">
  <div class="flex items-center gap-[8px]">
    <h3 class="text-[16px] text-[#1e293b] font-semibold">Flächenbezogene Komponenten</h3>
    <div class="flex-shrink-0 w-[16px] h-[16px] text-[#64748b]">
      <c-icon.info />
    </div>
  </div>
  </c-slot>
  <div class="flex flex-col gap-[8px] pt-[8px] size-full">
    <div class="flex justify-end">
      <button class="text-[14px] font-semibold text-[#0e7490] hover:opacity-80 transition-opacity">Filteroptionen</button>
    </div>
    <div class="border border-[#cbd5e1] rounded-[8px] bg-[#f8fafc] overflow-hidden">
      <div class="bg-[#f8fafc] p-[12px] border-b border-[#cbd5e1]">
        <h4 class="font-semibold text-[14px] text-[#1e293b]">Komponenten</h4>
      </div>
      <!-- {/* Generator */} -->
      <div class="border-b border-[#cbd5e1] bg-white  ">
        <div class="flex flex-col p-[12px] py-2 border-b border-[#cbd5e1]">
            <form>
          <c-list.index id='komponenten-tab-generator-list' count title="Generator" @detail-sidebar-closed.document="selected = null; $el.querySelectorAll('input:checked').forEach(el=>el.checked=false)" hiddenInputName='internal_ids' modeCallback="$dispatch('hide-detail-sidebar');"
                  >
              {% for item in generators %}
            <c-list.item
              id='generator-button-list{{ item.internal_id }}'
              :defaultHxDetails=True
              :selected=False
              :indicated=False
              :item=item
              value='{{ item.internal_id }}'
              title='{{item.name}}'
              radioName='internal_id'
          />
              {% endfor %}
          </c-list>
          </form>

        </div>
        <div class="flex flex-col p-[12px] py-2 border-b border-[#cbd5e1]">
            <form>
      <c-list.index id='komponenten-tab-heating-list' count title="Heizsystem konventionell" @detail-sidebar-closed.document="selected = null; $el.querySelectorAll('input:checked').forEach(el=>el.checked=false)" hiddenInputName='internal_ids' modeCallback="$dispatch('hide-detail-sidebar');"
              >
              {% for item in heaters %}
              <c-list.item
                id='heating-button-list{{ item.internal_id }}'
                :defaultHxDetails=True
                :selected=False
                :indicated=False
                :item=item
                value='{{ item.internal_id }}'
                title='{{item.name}}'
                radioName='internal_id'
            />
              {% endfor %}
          </c-list>
            </form>
        </div>
        <div class="flex flex-col p-[12px] py-2 border-b border-[#cbd5e1]">
            <form>
            <c-list.index id='komponenten-tab-solar-list' count title="Photovoltaik" @detail-sidebar-closed.document="selected = null; $el.querySelectorAll('input:checked').forEach(el=>el.checked=false)" hiddenInputName='internal_ids' modeCallback="$dispatch('hide-detail-sidebar');"
              >

              {% for item in solars %}
                <c-list.item
                  id='solar-button-list{{ item.internal_id }}'
                  :defaultHxDetails=True
                  :selected=False
                  :indicated=False
                  :item=item
                  value='{{ item.internal_id }}'
                  title='{{item.name}}'
                  radioName='internal_id'
              />
              {% endfor %}
          </c-list>
            </form>
        </div>
      </div>
    </div>
  </div>
  </c-expand.index>
  <c-expand.index expanded>
  <c-slot name="title">
  <div class="flex items-center gap-[8px]">
    <h3 class="text-[16px] text-[#1e293b] font-semibold">Vorlagen Bibliothek</h3>
    <div class="flex-shrink-0 w-[16px] h-[16px] text-[#64748b]">
      <c-icon.info />
    </div>
  </div>
  </c-slot>
  <div class="flex flex-col gap-[8px] pt-[8px] size-full">
    <div class="flex justify-end">
      <button class="text-[14px] font-semibold text-[#0e7490] hover:opacity-80 transition-opacity">+Vorlage</button>
    </div>
    <div class="border border-[#cbd5e1] rounded-[8px] bg-[#f8fafc] overflow-hidden">
        <form>
      <c-list :border=False customTitle >
        <c-slot name="title">
      <div class="flex justify-between bg-[#f8fafc] p-[12px] border-b border-[#cbd5e1] size-full">
        <h4 class="font-semibold text-[14px] text-[#1e293b]">Vorlagen</h4>
              <c-list.button/>
      </div>
          </c-slot>
      <c-list.item :border=False :selected=False title="Generator Vorlage" :indicated=False callback="handleViewChange('template-detail','Generator','Generator')"/>
      </c-list>
        </form>
    </div>
  </div>
  </c-expand.index>
</div>
