<details-sidebar-header class="block sticky top-0 bg-white border-b border-[#e2e8f0] p-[24px] z-[9999]">
  <div class="flex items-center justify-between gap-[8px]">
    <button
      onClick="handleViewChange('main')"
      class="flex items-center gap-[8px] hover:opacity-60 transition-opacity cursor-pointer"
    >
      <c-icon.arrow_left/>
      <span class="font-semibold text-[14px] text-[#1e293b] name-elem">Zu {{name}}</span>
    </button>
    <button @click="isOpen=false" class="flex-shrink-0 hover:opacity-60 transition-opacity">
      <c-icon.close/>
    </button>
  </div>
</details-sidebar-header>

<details-sidebar-content>
  <div class="px-[24px] py-[24px]">
    <div class="flex items-center justify-between mb-[24px]">
      <h2 class="font-bold text-[20px] text-[#1e293b]">LASTEN</h2>
      <button class="hover:opacity-60 transition-opacity">
        <c-icon.three_dots class='w-[20px] h-[20px]'/>
      </button>
    </div>

    <div class="flex flex-col gap-[16px]">
      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Name</label>
        <input
          type="text"
          value="Gebäude 11 - Heizung"
          class="bg-white border border-[#cbd5e1] rounded px-[16px] text-[14px] text-[#1e293b] py-2"
        />
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Typ</label>
        <c-select.index classButton='border-[#cbd5e1]!' selectedValue='1'>
          <c-select.button selectValue='1'>
            Heizung
          </c-select.button>
          <c-select.button selectValue='2'>
            Kühlung
          </c-select.button>
          <c-select.button selectValue='3'>
            Beleuchtung
          </c-select.button>
          <c-select.button selectValue='4'>
            Andere
          </c-select.button>
        </c-select.index>
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Berechnung via...</label>
        <c-select.index classButton='border-[#cbd5e1]!' selectedValue='1'>
          <c-select.button selectValue='1'>
            Jahressumme
          </c-select.button>
          <c-select.button selectValue='2'>
            Tagessumme
          </c-select.button>
          <c-select.button selectValue='3'>
            Stundenwerte
          </c-select.button>
        </c-select.index>
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Jahressumme</label>
        <div class="relative">
          <input
            type="text"
            value="600.000"
            class="bg-white border border-[#cbd5e1] rounded px-[16px] py-[12px] text-[14px] text-[#1e293b] w-full pr-[70px] pb-2"
          />
          <span class="absolute right-[16px] top-1/2 -translate-y-1/2 text-[14px] text-[#64748b]">kWh</span>
        </div>
      </div>

      <button class="w-full bg-[#0e7490] text-white font-semibold text-[14px] hover:bg-[#0c647a] transition-colors py-2 rounded-full">
        Speichern
      </button>

      <button
        onClick="handleViewChange('main')"
        class="w-full text-[#1e293b] font-semibold text-[14px] py-[8px] hover:opacity-80 transition-opacity"
      >
        <c-icon.close class='w-[16px] h-[16px]'/>
        Abbrechen
      </button>
    </div>
  </div>
</details-sidebar-content>
