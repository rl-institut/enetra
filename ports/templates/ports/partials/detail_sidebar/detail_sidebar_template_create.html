<details-sidebar-header class="block sticky top-0 bg-white border-b border-[#e2e8f0] p-[24px] z-[9999]">
  <div class="flex items-center justify-between gap-[8px]">
    <div class="flex items-center gap-[8px] flex-1">
      <div class="w-[8px] h-[8px] border border-[#1e293b] rotate-45"></div>
      <h2 class="font-bold text-[16px] text-[#1e293b]">Neue Vorlage</h2>
      <div class="hover:opacity-60 transition-opacity cursor-pointer">
        <svg class="w-[16px] h-[16px]" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="10" cy="4" r="1.5" />
          <circle cx="10" cy="10" r="1.5" />
          <circle cx="10" cy="16" r="1.5" />
        </svg>
      </div>
    </div>
    <button @click="isOpen=false" class="flex-shrink-0 hover:opacity-60 transition-opacity">
      <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M18 6L6 18M6 6l12 12" strokeLinecap="round" />
      </svg>
    </button>
  </div>
</details-sidebar-header>

<details-sidebar-content>
  <div class="px-[24px] py-[24px]">
    <div class="flex flex-col gap-[16px]">
      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Name</label>
        <input
          type="text"
          placeholder="Namen eingeben"
          class="bg-white border border-[#94a3b8] rounded-[3px] px-[16px] py-[12px] text-[14px] text-[#1e293b] placeholder-[#8999b4]"
        />
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Technologie</label>
        <select class="bg-white border border-[#94a3b8] rounded-[3px] px-[16px] py-[12px] text-[14px] text-[#1e293b] cursor-pointer">
          <option value="photovoltaik">Photovoltaik</option>
          <option value="gasheizung">Gasheizung</option>
          <option value="generator">Generator</option>
          <option value="heizstrahler">Heizstrahler</option>
        </select>
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b]">Flächen</label>
        <select class="bg-white border border-[#94a3b8] rounded-[3px] px-[16px] py-[12px] text-[14px] text-[#1e293b] cursor-pointer">
          <option value="">-- Auswählen --</option>
          <option value="lagerhalle-1">Lagerhalle 1</option>
          <option value="lagerhalle-2">Lagerhalle 2</option>
          <option value="lagerhalle-3">Lagerhalle 3</option>
          <option value="lagerhalle-4">Lagerhalle 4</option>
        </select>
      </div>

      <div class="flex items-center justify-between pt-[12px]">
        <div class="flex items-center gap-[8px]">
          <h3 class="font-normal text-[16px] text-[#1e293b] uppercase">Parameter</h3>
          {{infoIcon}}
        </div>
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b] flex items-center gap-[8px]">
          Wirkungsgrad
          {{infoIcon}}
        </label>
        <div class="bg-white border border-[#94a3b8] rounded-[3px] flex items-center justify-between">
          <input
            type="text"
            value="30"
            class="bg-white flex-1 px-[16px] py-[12px] text-[14px] text-[#1e293b] outline-none"
          />
          <div class="bg-[#f8fafc] px-[12px] py-[12px] text-[14px] text-[#1e293b]">%</div>
        </div>
      </div>

      <div class="flex flex-col gap-[8px]">
        <label class="font-semibold text-[14px] text-[#1e293b] flex items-center gap-[8px]">
          Investitionskosten
          {{infoIcon}}
        </label>
        <div class="bg-white border border-[#94a3b8] rounded-[3px] flex items-center justify-between">
          <input
            type="text"
            value="30"
            class="bg-white flex-1 px-[16px] py-[12px] text-[14px] text-[#1e293b] outline-none"
          />
          <div class="bg-[#f8fafc] px-[12px] py-[12px] text-[14px] text-[#1e293b]">€/kW</div>
        </div>
      </div>

      <div class="flex flex-col gap-[8px] pt-[12px]">
        <button class="w-full bg-[#0e7490] text-white font-bold text-[14px] hover:bg-[#0c647a] transition-colors py-[8px] rounded-full">
          Speichern
        </button>
        <button
          @click="isOpen=false"
          class="w-full bg-white border border-[#cbd5e1] flex items-center justify-center gap-[8px] text-[#51637c] font-normal text-[14px] hover:bg-[#f8fafc] transition-colors py-[8px] rounded-full"
        >
          <svg class="w-[16px] h-[16px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M18 6L6 18M6 6l12 12" strokeLinecap="round" />
          </svg>
          Abbrechen
        </button>
      </div>
    </div>
  </div>
</details-sidebar-content>
