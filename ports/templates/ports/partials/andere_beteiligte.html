<c-vars  :participants='[{"assignedTo":"Peter Placeholder", "buildingName":"temporary Temple"}, {"assignedTo":"Peter Placeholder", "buildingName":"temporary Temple"}]'></c-vars>
<c-expand.index>
  <c-slot name='title'>
        Andere Beteiligte ({{ participants|length }})
  </c-slot>
{% for participant in participants %}
      <div
           class="border border-[#cbd5e1] border-solid flex gap-[8px] items-center justify-between mb-[-1px] px-[12px] w-full bg-white py-1.5 first:rounded-tr-[8px] first:rounded-tl-[8px] last:rounded-br-[8px] last:rounded-bl-[8px] ">
        <div class="flex items-center gap-[8px] flex-1">
          <!-- {/* Layers Icon */} -->
          <div class="relative shrink-0 size-[12px]">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 strokeWidth="2"
                 class="text-[#64748b]">
              <polygon points="12 2 2 7 12 12 22 7 12 2" />
              <polyline points="2 17 12 22 22 17" />
              <polyline points="2 12 12 17 22 12" />
            </svg>
          </div>
          <p class="font-['Inter:Semi_Bold',sans-serif] text-[14px] text-[#64748b] font-normal">
            {{ participant.buildingName }}
          </p>
        </div>
        <div class="flex items-center gap-[8px] shrink-0">
          <!-- {/* Person Icon */} -->
          <div class="size-[12px]">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 strokeWidth="2"
                 class="text-[#64748b]">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
        <p class="font-['Inter:Semi_Bold',sans-serif] text-[14px] text-[#64748b] font-normal">{{participant.assignedTo}}</p>
        </div>
      </div>
    {% endfor %}
</c-expand.index>
