name: Code tests
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  dev-tools:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10"]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install ruff
      - name: ruff
        run: |
          ruff check
          ruff format --check
  Runner-job-of-Django-Tests-with-DB-Setup:
    needs: dev-tools
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10" ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/${{ github.repository_owner }}/enetra-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: DbName
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Create postgis extensions
        run: |
          PGPASSWORD=postgres psql -h postgres -d DbName -U postgres -c 'create extension postgis_raster;'
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: setup-chromedriver
        uses: nanasess/setup-chromedriver@v2.2.0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Dependency
        run: |
          uv sync
      - name: Run Tests
        run:
          uv run manage.py test
        env:
          DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DJANGO_ADMIN_PASSWORD: ${{ secrets.SECRET_KEY }}
          DJANGO_DEBUG: True
          DATABASE_URL: postgis://postgres:postgres@postgres/DbName
          CELERY_TASK_ALWAYS_EAGER: True
          CELERY_BROKER_URL: pyamqp://guest@localhost//
          TILING_SERVICE_TOKEN: ${{ secrets.TILING_SERVICE_TOKEN }}
          TILING_SERVICE_STYLE_ID: basic-v2
          DJANGO_SETTINGS_MODULE: enetra.settings
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          DJANGO_SECURE_SSL_REDIRECT: False
